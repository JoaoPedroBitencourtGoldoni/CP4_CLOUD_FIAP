# Nenhum dado sensivel fica fixo aqui.
# Tudo vem de variaveis de ambiente, passadas no "docker run" (local)
# ou no "az container create" (nuvem).

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# A tabela ja e criada pelo ddl.sql dentro do container do banco,
# entao o Spring NAO deve tentar criar/alterar o schema sozinho.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

server.port=8080
